# 本地调试 overlay：把仓库里的插件直接插进任意 profile，不打包、不安装。
#
#   dsh --profile desktop --patch D:\work\open0x01\dsh-git\examples\cordis.dev.yml --dump-config
#   dsh --profile desktop --patch D:\work\open0x01\dsh-git\examples\cordis.dev.yml
#
# 前置：先 `pnpm build`（overlay 指向 lib/，不是 src/）。
# 路径相对本文件解析；若你的 DSH 版本不接受相对路径，把 name 换成绝对路径即可。

- insert:
    - id: dsh-git-core
      name: ../packages/core/lib/index.js

    - id: dsh-git-local
      name: ../packages/local/lib/index.js
      config:
        timeoutMs: 20000
        maxOutputBytes: 65536
        enableNetwork: false

    - id: dsh-git-policy
      name: ../packages/policy/lib/index.js
      config:
        rules:
          read: allow
          write: ask
          network-write: deny

    - id: dsh-git-tool-git
      name: ../packages/tool-git/lib/index.js
      config:
        toolPrefix: ''
        enableWriteTools: true

    - id: dsh-git-github
      name: ../packages/github/lib/index.js
      config:
        tokenRef: GITHUB_TOKEN

    - id: dsh-git-tool-github
      name: ../packages/tool-github/lib/index.js
      config:
        toolPrefix: ''

    # host 侧只读 RPC：--patch 下即可用（curl / 前端 fetch 都能打）
    # 注意：浏览器里的面板（lib/client.js）由 dsh-client-modules 按**包名**解析，
    # 只有在 profile 里真正 `dsh plugin add` 安装后才会被加载；--patch 只覆盖 host 行。
    - id: dsh-git-client
      name: ../packages/client/lib/index.js
      config:
        rpcPath: /api/dsh-git
        maxCommits: 200
