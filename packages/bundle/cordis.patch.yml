# dsh-git bundle 层
#
# 语义（cordis plugin-include）：顶层是 patch 数组；`- insert:` 往 entry 列表里追加行。
# 行内 `name` 是**模块说明符**（包名或子路径），不是文件路径。
# 没有 remove：关掉一行只能 `disabled: true`。
#
# `id` 一旦发布就视为公开契约——用户可以在自己 profile 的 cordis.patch.yml 里按 id 覆盖任意一行。

- insert:
    # 服务定义：提供 ctx.gitRisk（工具包与策略包共享的风险注册表）
    - id: dsh-git-core
      name: dsh-git-core

    # 本地 git Provider：execFile('git', argv)，永不拼接 shell 字符串
    - id: dsh-git-local
      name: dsh-git-local
      config:
        timeoutMs: 20000
        maxOutputBytes: 65536
        # 网络操作默认关闭：git_fetch / git_pull / git_push 不注册
        enableNetwork: false

    # 审批策略：只作用于 dsh-git 自己注册的工具
    - id: dsh-git-policy
      name: dsh-git-policy
      config:
        rules:
          read: allow
          write: ask
          network-write: deny

    # 模型工具：本地 git（5 只读 + 6 写）
    - id: dsh-git-tool-git
      name: dsh-git-tool-git
      config:
        toolPrefix: ''
        enableWriteTools: true

    # GitHub Provider：纯 fetch 调 REST，凭据只存引用
    - id: dsh-git-github
      name: dsh-git-github
      config:
        tokenRef: GITHUB_TOKEN
        baseUrl: https://api.github.com
        maxFiles: 100
        maxDiffBytes: 200000

    # GitHub 工具（8 个 gh_*；gh_pr_create 是 network-write，默认被策略拒绝）
    - id: dsh-git-tool-github
      name: dsh-git-tool-github
      config:
        toolPrefix: ''

    # Web 面板：host 侧只读 RPC + 右侧边栏 Git tab
    - id: dsh-git-client
      name: dsh-git-client
      config:
        rpcPath: /api/dsh-git
        slot: right-sidebar
        maxCommits: 200
